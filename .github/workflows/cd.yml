name: CD

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          target: production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/certificatedu-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          target: production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/certificatedu-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
        with:
          host: 3.34.42.16
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,TOSS_CLIENT_KEY,TOSS_SECRET_KEY
          script: |
            set -e

            # Docker + git 설치 (없을 경우)
            if ! command -v docker &>/dev/null; then
              sudo dnf install -y docker git
              sudo systemctl enable --now docker
            fi

            if ! command -v git &>/dev/null; then
              sudo dnf install -y git
            fi

            # Docker Compose 플러그인 설치 (없을 경우)
            if ! sudo docker compose version &>/dev/null; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            # 레포 clone 또는 강제 동기화
            export GIT_TERMINAL_PROMPT=0
            if [ ! -d "$HOME/certificatedu/.git" ]; then
              git clone https://github.com/2026-3-1/3113-Nam-Seongyoon.git $HOME/certificatedu
            else
              git -C $HOME/certificatedu fetch origin
              git -C $HOME/certificatedu reset --hard origin/master
            fi

            # P1-P2-P3 → app 디렉토리 이름 변경 대응
            if [ -d "$HOME/certificatedu/P1-P2-P3" ] && [ ! -d "$HOME/certificatedu/app" ]; then
              mv "$HOME/certificatedu/P1-P2-P3" "$HOME/certificatedu/app"
            fi

            cd $HOME/certificatedu/app

            sudo -E docker compose pull
            sudo -E docker compose up -d --remove-orphans
            sudo docker image prune -f

            echo "✅ 배포 완료: $(date)"
