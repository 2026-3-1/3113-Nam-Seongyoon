name: CD

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./P1-P2-P3/backend
          target: production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/certificatedu-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./P1-P2-P3/frontend
          target: production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/certificatedu-frontend:latest
          build-args: |
            VITE_TOSS_CLIENT_KEY=${{ secrets.VITE_TOSS_CLIENT_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 3.34.42.16
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOCKERHUB_USERNAME
          script: |
            set -e
            cd ~/certificatedu/P1-P2-P3

            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "✅ 배포 완료: $(date)"
