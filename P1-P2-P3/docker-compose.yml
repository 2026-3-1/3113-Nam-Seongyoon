version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: certificatedu-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: certificatedu
      MYSQL_USER: certificatedu
      MYSQL_PASSWORD: certificatedu_pass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "certificatedu", "-pcertificatedu_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/certificatedu-backend:latest
    build:
      context: ./backend
      target: production
    container_name: certificatedu-backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_TYPE: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: certificatedu
      DB_PASSWORD: certificatedu_pass
      DB_DATABASE: certificatedu
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/certificatedu-frontend:latest
    build:
      context: ./frontend
      target: production
    container_name: certificatedu-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
