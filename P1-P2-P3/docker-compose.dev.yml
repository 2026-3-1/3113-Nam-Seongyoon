version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: certificatedu-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: certificatedu
      MYSQL_USER: certificatedu
      MYSQL_PASSWORD: certificatedu_pass
    volumes:
      - mysql_data_dev:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "certificatedu", "-pcertificatedu_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: builder
    container_name: certificatedu-backend-dev
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_TYPE: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: certificatedu
      DB_PASSWORD: certificatedu_pass
      DB_DATABASE: certificatedu
    volumes:
      - ./backend/src:/app/src
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      target: builder
    container_name: certificatedu-frontend-dev
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql_data_dev:
