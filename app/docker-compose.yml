name: certificatedu

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: certificatedu
      MYSQL_USER: certificatedu
      MYSQL_PASSWORD: certificatedu_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "certificatedu", "-pcertificatedu_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/certificatedu-backend:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_TYPE: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: certificatedu
      DB_PASSWORD: certificatedu_pass
      DB_DATABASE: certificatedu
      JWT_SECRET: ${JWT_SECRET:-certificatedu-jwt-secret-change-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-certificatedu-refresh-secret-change-in-prod}
      CORS_ORIGINS: http://3.34.42.16
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/certificatedu-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
