openapi: "3.0.3"
info:
  title: CertificatEdu API — P1 초안
  version: "1.0"
  description: P1 단계 강의 CRUD API 초안 (인증 미적용)

servers:
  - url: http://localhost:3000/api
    description: 로컬 개발 서버

paths:
  /courses:
    get:
      summary: 강의 목록 조회
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 강의 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Course" }
                  total: { type: integer }
                  page: { type: integer }
                  totalPages: { type: integer }
    post:
      summary: 강의 등록
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: 생성된 강의
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }

  /courses/{id}:
    get:
      summary: 강의 상세 조회
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 강의 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404":
          description: 강의 없음
    patch:
      summary: 강의 수정
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "200":
          description: 수정된 강의
    delete:
      summary: 강의 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 삭제 결과

components:
  schemas:
    Course:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        thumbnail: { type: string }
        price: { type: integer }
        originalPrice: { type: integer, nullable: true }
        badge: { type: string }
        duration: { type: string }
        tag: { type: string, nullable: true }
        isPublished: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CourseInput:
      type: object
      required: [title, category, description, thumbnail, price]
      properties:
        title: { type: string }
        category: { type: string }
        description: { type: string }
        thumbnail: { type: string }
        price: { type: integer }
        originalPrice: { type: integer }
        badge: { type: string }
        duration: { type: string }
        tag: { type: string }
